<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAG Visual System — Gestão Integrada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-slate-800 pb-24">

    <!-- CABEÇALHO -->
    <header class="bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-xl font-black text-lg shadow">GAG</div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">GAG Visual System</h1>
                    <p class="text-xs text-indigo-400 font-medium">Marketing Automation • Local</p>
                </div>
            </div>
            <button onclick="toggleAdmin()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition">
                <i class="fa-solid fa-lock text-indigo-400 mr-1"></i> ADM
            </button>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- PAINEL / DASHBOARD -->
        <section id="tab-dashboard" class="space-y-4">
            <div>
                <h2 class="text-xl font-bold text-slate-900">Relatórios e Análises</h2>
                <p class="text-xs text-slate-500">Acompanhe o desempenho real do negócio e da nuvem Supabase.</p>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-xs font-semibold text-slate-400 uppercase">Receita Registada</p>
                    <p id="metric-revenue" class="text-lg font-black text-slate-800 mt-1">Kz 0</p>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-xs font-semibold text-slate-400 uppercase">Relatórios</p>
                    <p id="metric-reports" class="text-lg font-black text-slate-800 mt-1">0</p>
                </div>
            </div>

            <!-- REGISTAR RELATÓRIO / DADOS -->
            <form onsubmit="addReport(event)" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                <p class="text-xs font-bold text-slate-800 uppercase">Novo Registo Financeiro</p>
                <input type="text" id="report-name" placeholder="Descrição do Relatório" required class="w-full text-xs p-3 rounded-xl border border-slate-200">
                <input type="number" id="report-revenue" placeholder="Valor (Kz)" required class="w-full text-xs p-3 rounded-xl border border-slate-200">
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-3 rounded-xl transition">Guardar no Supabase</button>
            </form>
            <div id="list-reports" class="space-y-2"></div>
        </section>

        <!-- SECÇÃO CRM -->
        <section id="tab-crm" class="hidden space-y-4">
            <h2 class="text-xl font-bold text-slate-900">Gestão de Clientes</h2>
            <form onsubmit="addClient(event)" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                <input type="text" id="client-name" placeholder="Nome do Cliente" required class="w-full text-xs p-3 rounded-xl border border-slate-200">
                <input type="text" id="client-contact" placeholder="Contacto / Telefone" class="w-full text-xs p-3 rounded-xl border border-slate-200">
                <button type="submit" class="w-full bg-slate-900 text-white font-bold text-xs py-3 rounded-xl">Registar Cliente</button>
            </form>
            <div id="list-clients" class="space-y-2"></div>
        </section>

        <!-- SECÇÃO ORÇAMENTOS -->
        <section id="tab-quotes" class="hidden space-y-4">
            <h2 class="text-xl font-bold text-slate-900">Orçamentos & Propostas</h2>
            <form onsubmit="addQuote(event)" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                <input type="text" id="quote-title" placeholder="Título da Proposta" required class="w-full text-xs p-3 rounded-xl border border-slate-200">
                <input type="text" id="quote-client" placeholder="Nome do Cliente" required class="w-full text-xs p-3 rounded-xl border border-slate-200">
                <input type="number" id="quote-amount" placeholder="Valor (Kz)" required class="w-full text-xs p-3 rounded-xl border border-slate-200">
                <button type="submit" class="w-full bg-slate-900 text-white font-bold text-xs py-3 rounded-xl">Guardar Proposta</button>
            </form>
            <div id="list-quotes" class="space-y-2"></div>
        </section>

    </main>

    <!-- MENU DE NAVEGAÇÃO INFERIOR -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-4 py-3 z-50">
        <div class="max-w-md mx-auto flex justify-around">
            <button onclick="switchTab('dashboard')" id="btn-dash" class="flex flex-col items-center text-indigo-600 text-xs font-semibold">
                <i class="fa-solid fa-chart-pie text-lg mb-0.5"></i> Dashboard
            </button>
            <button onclick="switchTab('crm')" id="btn-crm" class="flex flex-col items-center text-slate-400 text-xs font-semibold">
                <i class="fa-solid fa-users text-lg mb-0.5"></i> CRM
            </button>
            <button onclick="switchTab('quotes')" id="btn-quotes" class="flex flex-col items-center text-slate-400 text-xs font-semibold">
                <i class="fa-solid fa-file-invoice text-lg mb-0.5"></i> Orçamento
            </button>
        </div>
    </nav>

    <script>
        const SUPABASE_URL = "https://kjemvkaxnxeaxdhbjzip.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqZW12a2F4bnhlYXhkaGJqemlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MzY3NjcsImV4cCI6MjEwMjAxMjc2N30.nU-qBcuvpFGcur9pkNWq2mLnIhuVrH3nIfi42f4R3J4";
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function switchTab(tabName) {
            document.querySelectorAll('main > section').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');

            // Atualizar cores dos botões inferiores
            ['dash', 'crm', 'quotes'].forEach(t => {
                const btn = document.getElementById(`btn-${t}`);
                if(btn) {
                    btn.className = t === tabName ? "flex flex-col items-center text-indigo-600 text-xs font-semibold" : "flex flex-col items-center text-slate-400 text-xs font-semibold";
                }
            });
        }

        function toggleAdmin() {
            const pass = prompt("Digite a Senha de Administrador:");
            if (pass === "1234" || pass === "gagvisual") {
                alert("Modo Administrador Ativado com Sucesso!");
            } else if(pass !== null) {
                alert("Senha Incorreta!");
            }
        }

        // ADICIONAR RELATÓRIO
        async function addReport(e) {
            e.preventDefault();
            const name = document.getElementById('report-name').value;
            const revenue = parseFloat(document.getElementById('report-revenue').value);

            const { error } = await _supabase.from('reports').insert([{ name, revenue }]);
            if (error) alert("Erro: " + error.message);
            else {
                document.getElementById('report-name').value = '';
                document.getElementById('report-revenue').value = '';
                loadData();
            }
        }

        // ADICIONAR CLIENTE
        async function addClient(e) {
            e.preventDefault();
            const name = document.getElementById('client-name').value;
            const contact = document.getElementById('client-contact').value;

            const { error } = await _supabase.from('clients').insert([{ name, contact }]);
            if (error) alert("Erro: " + error.message);
            else {
                document.getElementById('client-name').value = '';
                document.getElementById('client-contact').value = '';
                loadData();
            }
        }

        // ADICIONAR ORÇAMENTO
        async function addQuote(e) {
            e.preventDefault();
            const title = document.getElementById('quote-title').value;
            const client = document.getElementById('quote-client').value;
            const amount = parseFloat(document.getElementById('quote-amount').value);

            const { error } = await _supabase.from('quotes').insert([{ title, client, amount }]);
            if (error) alert("Erro: " + error.message);
            else {
                document.getElementById('quote-title').value = '';
                document.getElementById('quote-client').value = '';
                document.getElementById('quote-amount').value = '';
                loadData();
            }
        }

        // CARREGAR TUDO DO SUPABASE
        async function loadData() {
            // Relatórios
            const { data: reports } = await _supabase.from('reports').select('*');
            if (reports) {
                document.getElementById('metric-reports').innerText = reports.length;
                let totalRev = reports.reduce((acc, r) => acc + Number(r.revenue || 0), 0);
                document.getElementById('metric-revenue').innerText = "Kz " + totalRev.toLocaleString();

                let rHtml = '';
                reports.forEach(r => {
                    rHtml += `<div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center text-xs">
                        <div><p class="font-bold text-slate-800">${r.name}</p><p class="text-slate-400">Registo financeiro</p></div>
                        <span class="font-black text-indigo-600">Kz ${Number(r.revenue).toLocaleString()}</span>
                    </div>`;
                });
                document.getElementById('list-reports').innerHTML = rHtml || '<p class="text-xs text-slate-400 text-center py-2">Sem relatórios registados.</p>';
            }

            // Clientes
            const { data: clients } = await _supabase.from('clients').select('*');
            if (clients) {
                let cHtml = '';
                clients.forEach(c => {
                    cHtml += `<div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center text-xs">
                        <div><p class="font-bold text-slate-800">${c.name}</p><p class="text-slate-400">${c.contact || 'Sem contacto'}</p></div>
                    </div>`;
                });
                document.getElementById('list-clients').innerHTML = cHtml || '<p class="text-xs text-slate-400 text-center py-2">Sem clientes registados.</p>';
            }

            // Orçamentos
            const { data: quotes } = await _supabase.from('quotes').select('*');
            if (quotes) {
                let qHtml = '';
                quotes.forEach(q => {
                    qHtml += `<div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center text-xs">
                        <div><p class="font-bold text-slate-800">${q.title}</p><p class="text-slate-400">Cliente: ${q.client}</p></div>
                        <span class="font-black text-indigo-600">Kz ${Number(q.amount).toLocaleString()}</span>
                    </div>`;
                });
                document.getElementById('list-quotes').innerHTML = qHtml || '<p class="text-xs text-slate-400 text-center py-2">Sem propostas registadas.</p>';
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
