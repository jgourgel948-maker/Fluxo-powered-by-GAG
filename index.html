<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAG Visual System — Gestão Integrada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-slate-800 pb-20">

    <!-- CABEÇALHO / IDENTIDADE VISUAL -->
    <header class="bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-xl font-black text-lg shadow">GAG</div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">GAG Visual System</h1>
                    <p class="text-xs text-indigo-400 font-medium">Gestão Integrada & Automação</p>
                </div>
            </div>
            <button onclick="toggleAdmin()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition">
                <i class="fa-solid fa-lock text-indigo-400 mr-1"></i> ADM
            </button>
        </div>
    </header>

    <!-- PAINEL PRINCIPAL -->
    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- DASHBOARD GENERAL -->
        <section id="tab-dashboard" class="space-y-4">
            <div>
                <h2 class="text-xl font-bold text-slate-900">Painel Geral</h2>
                <p class="text-xs text-slate-500">Visão consolidada da operação na nuvem Supabase.</p>
            </div>

            <!-- CARDS DE MÉTRICAS -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Receita Total</p>
                    <p id="metric-revenue" class="text-lg font-black text-slate-800 mt-1">Kz 0</p>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Clientes CRM</p>
                    <p id="metric-clients" class="text-lg font-black text-slate-800 mt-1">0</p>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Propostas Ativas</p>
                    <p id="metric-quotes" class="text-lg font-black text-slate-800 mt-1">0</p>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Projetos em Curso</p>
                    <p id="metric-projects" class="text-lg font-black text-slate-800 mt-1">0</p>
                </div>
            </div>

            <!-- AÇÕES RÁPIDAS -->
            <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-100 space-y-2">
                <p class="text-xs font-bold text-indigo-900 uppercase">Ações Rápidas</p>
                <div class="flex space-x-2">
                    <button onclick="switchTab('crm')" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold py-2.5 rounded-xl shadow transition">
                        + Novo Cliente
                    </button>
                    <button onclick="switchTab('quotes')" class="flex-1 bg-white hover:bg-slate-50 text-indigo-900 text-xs font-semibold py-2.5 rounded-xl border border-indigo-200 transition">
                        + Criar Proposta
                    </button>
                </div>
            </div>
        </section>

        <!-- SEÇÃO CRM -->
        <section id="tab-crm" class="hidden space-y-4">
            <h2 class="text-xl font-bold text-slate-900">Gestão de Clientes (CRM)</h2>
            <form id="form-client" onsubmit="addClient(event)" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                <input type="text" id="client-name" placeholder="Nome do Cliente" required class="w-full text-xs p-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-600">
                <input type="text" id="client-contact" placeholder="Contacto / Email" class="w-full text-xs p-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-600">
                <button type="submit" class="w-full bg-slate-900 text-white font-bold text-xs py-3 rounded-xl hover:bg-slate-800 transition">Registar Cliente</button>
            </form>
            <div id="list-clients" class="space-y-2"></div>
        </section>

        <!-- SEÇÃO ORÇAMENTOS -->
        <section id="tab-quotes" class="hidden space-y-4">
            <h2 class="text-xl font-bold text-slate-900">Orçamentos & Propostas</h2>
            <form id="form-quote" onsubmit="addQuote(event)" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                <input type="text" id="quote-title" placeholder="Título da Proposta" required class="w-full text-xs p-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-600">
                <input type="text" id="quote-client" placeholder="Nome do Cliente" required class="w-full text-xs p-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-600">
                <input type="number" id="quote-amount" placeholder="Valor (Kz)" required class="w-full text-xs p-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-600">
                <button type="submit" class="w-full bg-slate-900 text-white font-bold text-xs py-3 rounded-xl hover:bg-slate-800 transition">Guardar Proposta</button>
            </form>
            <div id="list-quotes" class="space-y-2"></div>
        </section>

    </main>

    <!-- NAVEGAÇÃO INFERIOR -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-4 py-2 z-50">
        <div class="max-w-md mx-auto flex justify-around">
            <button onclick="switchTab('dashboard')" class="flex flex-col items-center text-indigo-600 text-xs font-semibold">
                <i class="fa-solid fa-chart-pie text-lg mb-0.5"></i> Painel
            </button>
            <button onclick="switchTab('crm')" class="flex flex-col items-center text-slate-400 hover:text-indigo-600 text-xs font-semibold">
                <i class="fa-solid fa-users text-lg mb-0.5"></i> CRM
            </button>
            <button onclick="switchTab('quotes')" class="flex flex-col items-center text-slate-400 hover:text-indigo-600 text-xs font-semibold">
                <i class="fa-solid fa-file-invoice text-lg mb-0.5"></i> Orçamento
            </button>
        </div>
    </nav>

    <script>
        // LIGAÇÃO SUPABASE
        const SUPABASE_URL = "https://kjemvkaxnxeaxdhbjzip.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqZW12a2F4bnhlYXhkaGJqemlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MzY3NjcsImV4cCI6MjEwMjAxMjc2N30.nU-qBcuvpFGcur9pkNWq2mLnIhuVrH3nIfi42f4R3J4";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function switchTab(tabName) {
            document.querySelectorAll('main > section').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
        }

        function toggleAdmin() {
            const pass = prompt("Digite a Senha de Administrador:");
            if (pass === "1234" || pass === "gagvisual") {
                alert("Modo Administrador Ativado!");
            } else if(pass !== null) {
                alert("Senha Incorreta!");
            }
        }

        // CARREGAR DADOS
        async function loadData() {
            const { data: clients } = await _supabase.from('clients').select('*');
            const { data: quotes } = await _supabase.from('quotes').select('*');
            
            if (clients) document.getElementById('metric-clients').innerText = clients.length;
            if (quotes) {
                document.getElementById('metric-quotes').innerText = quotes.length;
                let total = quotes.reduce((acc, q) => acc + Number(q.amount || 0), 0);
                document.getElementById('metric-revenue').innerText = "Kz " + total.toLocaleString();
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
